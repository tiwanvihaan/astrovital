<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>AstroVital</title>
<style>
:root{--bg:#EAF4FF;--card:#fff;--tx:#07172B;--mu:#667286;--bl:#278BEA;--lb:#80C9FF;--ln:#d3e6f8;--mv:#278BEA;--ex:#80C9FF;--rc:#1F5FAE;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
:root[data-theme=dark]{--bg:#07172B;--card:#102B50;--tx:#fff;--mu:#9db4d0;--ln:#1d426f;--rc:#4A93E8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif}
#app{max-width:360px;margin:0 auto;padding:14px 16px 110px}
.card{background:var(--card);border-radius:24px;padding:18px;margin:12px 0}
h1{font-size:26px;margin:6px 0 2px;letter-spacing:-.025em}h2{font-size:21px;margin:18px 0 6px}h3{margin:0 0 4px;font-size:17px}
.mu{color:var(--mu);font-size:14px}.big{font-size:32px;font-weight:700;letter-spacing:-.03em;line-height:1.1}.u{font-size:16px;color:var(--mu);font-weight:500}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;border-top:1px solid var(--ln);cursor:pointer}.row:first-child{border:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:22px;padding:15px;cursor:pointer;min-width:0}
button{font:inherit;border:0;border-radius:14px;background:var(--bl);color:#fff;padding:12px 16px;font-weight:600;cursor:pointer}
button.g{background:rgba(39,139,234,.16);color:var(--bl)}button.d{background:rgba(255,69,58,.14);color:#FF453A}button.s{padding:7px 12px;font-size:14px;border-radius:12px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--lb)}
input,select,textarea{font:inherit;width:100%;box-sizing:border-box;padding:12px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);margin:4px 0}
nav{position:fixed;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(20px);border-top:1px solid var(--ln);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
nav div{max-width:360px;margin:auto;display:flex}nav button{flex:1;background:none;color:var(--mu);padding:5px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}nav button.on{color:var(--bl)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{height:26px;max-width:150px;object-fit:contain;display:block}.lg{background:#fff;border-radius:10px;padding:5px 9px}
.pill{display:inline-block;padding:4px 10px;border-radius:99px;background:rgba(39,139,234,.16);color:var(--bl);font-size:13px;font-weight:600;border:0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.bar{height:10px;border-radius:9px;background:var(--ln);overflow:hidden}.bar i{display:block;height:100%;background:var(--bl);border-radius:9px}
.ring{--c:0;animation:rg 1.3s cubic-bezier(.2,.8,.2,1)}@keyframes rg{from{stroke-dashoffset:var(--c)}}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:20}.sheet.show{display:flex;align-items:flex-end;justify-content:center}
.sin{background:var(--bg);width:100%;max-width:360px;max-height:90vh;overflow:auto;border-radius:26px 26px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--bl);color:#fff;padding:10px 18px;border-radius:99px;font-weight:600;z-index:30;display:none}#toast.show{display:block;animation:pop .4s}
@keyframes pop{from{transform:translateX(-50%) scale(.8)}}
.bub{padding:10px 14px;border-radius:18px;margin:6px 0;max-width:88%;white-space:pre-wrap}.me{background:var(--bl);color:#fff;margin-left:auto}.ai{background:var(--card)}
@media(prefers-reduced-motion:reduce){.ring,#toast{animation:none}}
@media(max-width:300px){.grid{grid-template-columns:1fr}#app{padding:10px 8px 90px}.card{padding:12px;border-radius:20px}.big{font-size:26px}nav button{font-size:10px}}</style></head><body><div id="app"></div><div id="toast"></div><div class="sheet" id="sh" onclick="if(event.target==this)cl()"><div class="sin" id="shc"></div></div>

 return`${head('Achievements','pr')}<div class="card"><div class="big">${t}<span class="u"> AstroPoints</span></div><p class="mu">Level ${Math.floor(t/200)+1}. Streak ${streak()} days. Points reward approved wellness tasks only. Resting, symptoms and medical absences never cost points, and nobody is ranked by medical data.</p></div><div class="card">${A.map(a=>`<div class="row" style="cursor:default"><span>${a[0]}</span><b style="color:${a[1]?'var(--rc)':'var(--mu)'}">${a[1]?'Unlocked':'Locked'}</b></div>`).join('')}</div><div class="card"><h3>Points guide</h3><p class="mu">Check-in 20, mobility assessment 25, hydration goal 15, workout 30, sleep 15, nutrition log 10, weekly review 50. Each once per day (weekly once per week).</p></div>`}
const G=[['hr','Heart rate','Heartbeats per minute.','Shows cardiovascular load and recovery.','Wrist sensor, chest strap or manual pulse count.','Wearable or fingers on wrist for 30 s, doubled.','Exercise, caffeine, stress, sleep, hydration.','Resting rate stays unusually high or low, or you feel faint or have chest pain.'],['spo2','Blood oxygen','Oxygen carried by your blood (SpO₂).','Low levels may signal breathing or cabin air problems.','Pulse oximeter.','Rest, warm hands, clip on a finger, wait for a steady value.','Cold hands, motion, nail polish, cabin air.','Readings fall below your configured range or you feel short of breath.'],['rr','Respiratory rate','Breaths per minute.','Early sign of changes in breathing or fatigue.','Timer or wearable.','Sit still, count breaths for 60 s.','Exercise, anxiety, talking.','Breathing feels hard or rate stays outside range.'],['mobility','Mobility','How freely you move.','Tracks adaptation and change in microgravity or low gravity.','Assessments in the Mobility tab.','Follow each assessment’s steps on the same schedule.','Fatigue, pain, equipment, posture.','New pain or sudden loss of movement.'],['rom','Range of motion','How far a joint moves.','Helps spot stiffness or injury.','Goniometer or inclinometer.','Move slowly to a comfortable limit and read the angle.','Warm-up, pain, technique.','Pain or locked joints.'],['bal','Balance','Steadiness on a base of support.','Changes with vestibular and muscle changes.','Handhold and timer.','Stand on one foot near a handhold and time it.','Fatigue, footwear, vision.','Dizziness or falls.'],['bone','Bone health','Bone strength and density, measured clinically.','Microgravity can reduce bone mass over time.','Clinical scanner and medical team.','Medical team runs scans. Log results here.','Exercise load, nutrition, vitamin D.','Bone pain or any injury.'],['str','Muscle performance','Strength and power output.','Muscles weaken without load in space.','Dynamometer or exercise device readouts.','Use the approved device and record the best of 3.','Sleep, nutrition, recent workouts.','Sharp pain or sudden weakness.'],['slp','Sleep','Time and quality of sleep.','Drives recovery, alertness and mood.','Wearable or sleep log.','Log hours, bedtime and interruptions each morning.','Light, noise, schedule shifts.','Persistent insomnia or severe fatigue.'],['rcv','Recovery','How ready your body is after load.','Prevents overtraining.','Sleep, rest days, check-ins.','Log sleep and fatigue regularly.','Workload, stress, nutrition.','Fatigue that does not improve with rest.'],['hyd','Hydration','Water balance.','Fluid shifts are common in microgravity.','Water log.','Log each drink. Aim for your configured goal.','Heat, exercise, diet.','Dizziness, dark urine or very low intake.'],['rad','Radiation exposure','Dose from space radiation.','Long missions raise cumulative dose.','Dosimeter on board.','Record dosimeter readings as instructed.','Location, solar activity, shielding.','Readings exceed mission limits.'],['env','Environment monitoring','Temperature, humidity and CO₂.','Cabin air affects focus, sleep and health.','Cabin sensors.','Record values from approved sensors.','Crew size, ventilation.','CO₂ alarms or headaches in the cabin.']];
function gd(k){if(k){const g=G.find(x=>x[0]==k)||G[0];return`${head(g[1],'gd')}<div class="card">${['What it measures','Why it matters','Equipment','Steps','What can affect it','Contact the medical team when'].map((l,i)=>`<h3>${l}</h3><p>${g[i+2]}</p>`).join('')}<p class="mu">How it is measured: see equipment and steps above.</p></div>`}return`${head('Health Guide','pr')}<div class="card">${G.map(g=>rowH(g[1],g[2],`go('gd:${g[0]}')`)).join('')}</div>`}
function ask(){const q=(val('cq')||'').trim();if(!q)return;const l=q.toLowerCase();let a;const d=k=>series(k).some(x=>x.src=='Demo data')?' (demo data)':'';
 if(/sleep/.test(l)){const s=[...S.sleep].sort((x,y)=>x.d>y.d?1:-1);a=s.length<2?`I only have ${s.length} sleep entries, so I can’t describe a change yet. Log a few nights.`:`Your last ${Math.min(7,s.length)} nights averaged ${(s.slice(-7).reduce((x,y)=>x+y.h,0)/Math.min(7,s.length)).toFixed(1)} h versus ${s.slice(-14,-7).length?(s.slice(-14,-7).reduce((x,y)=>x+y.h,0)/s.slice(-14,-7).length).toFixed(1)+' h before':'no earlier week to compare'}.`}
 else if(/due|assess/.test(l))a='Assessments due (none in 30 days): '+(Object.keys(AS).filter(k=>!S.asm.some(x=>x.k==k&&x.d>=D(30))).map(k=>AS[k][0]).join(', ')||'none');
 else if(/heart|hr/.test(l)){const s=series('hr');a=s.length?`Heart rate${d('hr')}: ${s.length} readings, low ${Math.min(...s.map(x=>x.v))}, high ${Math.max(...s.map(x=>x.v))}, latest ${s[s.length-1].v} bpm. The graph plots bpm over time. Values rise with activity and fall at rest. I can’t interpret it medically.`:'No heart rate readings yet.'}
 else if(/mobility|measure/.test(l))a='Mobility assessments record balance, range of motion, coordination, flexibility, strength and walking endurance. Open Mobility and pick one for its purpose and steps.';

 else if(/summary|mission/.test(l))a=`Mission summary: ${S.workouts.length} workouts, ${S.sleep.length} sleep nights, ${S.asm.length} assessments, ${tot()} AstroPoints. Vitals shown are ${S.demo?'demo values where nothing is recorded':'recorded values only'}.`;

function cop(){return`${head('AstroCopilot','pr')}<div class="card"><p class="mu">Answers come from rules over your stored data, not a live AI model. No diagnosis, no medication advice.</p>${(S.cp||[]).map(m=>`<div class="bub ${m[0]}">${E(m[1])}</div>`).join('')}<div style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0">${['How has my sleep changed?','Explain my heart rate graph','Which data is missing?','Mission summary','Why is bone health important?'].map(x=>`<button class="g s" onclick="$('#cq').value=this.textContent;ask()">${x}</button>`).join('')}</div><input id="cq" placeholder="Ask a question" onkeydown="if(event.key=='Enter')ask()"><button onclick="ask()">Ask</button></div>`}
